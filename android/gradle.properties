# Sized for a 16GB machine: the previous 8G heap + 4G metaspace exhausted
# physical RAM near the end of release builds and crashed the Gradle daemon.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m
# Limit parallel workers so javac/Kotlin/R8 don't stack up memory spikes.
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
